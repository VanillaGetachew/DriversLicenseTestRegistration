<div class="header">
  <div class="header-left">
    <button mat-icon-button class="toggle-btn" (click)="toggleSidebar()">
      <mat-icon>menu</mat-icon>
    </button>
    <img src="assets/images/ReportLogo.png" alt="Reports Logo" class="reports-logo">
    <div class="app-title">{{ 'header.appTitle' | translate }}</div>
  </div>
  
  <div class="header-right">
    <app-language-selector></app-language-selector>
    <button mat-icon-button [matMenuTriggerFor]="profileMenu" aria-label="User profile">
      <mat-icon>account_circle</mat-icon>
    </button>
    <mat-menu #profileMenu="matMenu" xPosition="before">
      <button mat-menu-item routerLink="/profile">
        <mat-icon>person</mat-icon>
        <span>{{ 'header.myProfile' | translate }}</span>
      </button>
      <button mat-menu-item (click)="changePassword()">
        <mat-icon>lock</mat-icon>
        <span>{{ 'header.changePassword' | translate }}</span>
      </button>
      <button mat-menu-item (click)="logout()">
        <mat-icon>exit_to_app</mat-icon>
        <span>{{ 'header.logout' | translate }}</span>
      </button>
    </mat-menu>
  </div>
</div>
